name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *" # monthly: hook formats and guards change quickly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: vet for Windows (not a release target; keeps go install working)
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: test
        run: go test -race -count=1 -timeout 25m ./...
        env:
          APPLYGATE_ORACLE: separate # the effects oracle has its own step below
      - name: effects oracle (gate; runs allowed commands under every shell here against fake tools)
        shell: bash # with pipefail, so a failing test fails the step through tee
        run: go test -count=1 -timeout 25m -v -run TestEffectsOracle ./harness 2>&1 | tee oracle.log
        env:
          APPLYGATE_ORACLE: required # a skip fails: it must run on both runners
      - name: effects oracle summary
        if: always()
        run: |
          {
            echo "### Effects oracle"
            grep -E 'oracle seed|oracle: |no zsh|FAIL|allowed from' oracle.log | sed 's/^ *//; s/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: decision latency (normal build, 50 ms p95)
        run: go test -count=1 -v -run TestCommandLatency ./harness
      - name: build
        run: go build -trimpath -o bin/applygate ./cmd/applygate
      - name: selftest (scenario pack through the binary)
        run: bin/applygate selftest
      - name: replay runner unit tests
        run: python3 -I harness/test_run.py
      - name: black-box replay (never executes scenario commands)
        run: python3 -I harness/run.py --guard bin/applygate --md replay.md && cat replay.md >> "$GITHUB_STEP_SUMMARY"
      - name: black-box replay in the Codex format
        run: python3 -I harness/run.py --guard bin/applygate --format codex --md replay-codex.md && cat replay-codex.md >> "$GITHUB_STEP_SUMMARY"
      - name: open findings of the v0.6.0 review (internal/reviewgap)
        run: |
          {
            echo "### Open review findings"
            go test -count=1 -v -run 'TestAttackPack|Review' ./... 2>&1 | grep -oE 'open finding [A-J][0-9]+' | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: fuzz shell analyzer (short)
        if: matrix.os == 'ubuntu-latest'
        run: go test -run XXX -fuzz FuzzAnalyze -fuzztime 30s ./internal/shell
      - name: keep the failing fuzz input
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: internal/shell/testdata/fuzz/
          if-no-files-found: ignore
