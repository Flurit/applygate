name: action-check

# Exercises action.yml against this commit's own binary with the two real
# AWS-provider plans kept under testdata/real_plan, so a change to the action
# or to plan-check shows up here.
#
# Three steps ask for the pull-request comment (comment: true) while the job
# has no pull-requests: write, so each run takes the path where the Action
# cannot comment: on a push there is no pull request, on a pull request the
# token is refused. The verdicts, the outputs and the failing step must be
# what they are without the comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o bin/applygate ./cmd/applygate
      - name: destructive plan in a protected tier blocks
        id: blocked
        uses: ./
        with:
          plan: testdata/real_plan/delete_real_shape.show.json
          tier: protected
          fail-on: never
          binary: bin/applygate
          comment: true
      - name: destructive plan in a standard tier asks
        id: asked
        uses: ./
        with:
          plan: testdata/real_plan/delete_real_shape.show.json
          tier: standard
          fail-on: never
          binary: bin/applygate
      - name: create plan in a standard tier allows
        id: allowed
        uses: ./
        with:
          plan: testdata/real_plan/create.show.json
          tier: standard
          fail-on: block
          binary: bin/applygate
          comment: true
          comment-key: create plan, standard tier
      - name: assert verdicts
        run: |
          test "${{ steps.blocked.outputs.verdict }}" = block
          test "${{ steps.blocked.outputs.exit-code }}" = 3
          test "${{ steps.asked.outputs.verdict }}" = ask
          test "${{ steps.allowed.outputs.verdict }}" = allow
          test "${{ steps.allowed.outputs.exit-code }}" = 0
          test "${{ steps.blocked.outcome }}" = success
          test "${{ steps.allowed.outcome }}" = success
      - name: fail-on block really fails
        id: mustfail
        continue-on-error: true
        uses: ./
        with:
          plan: testdata/real_plan/delete_real_shape.show.json
          tier: protected
          binary: bin/applygate
          comment: true
      - run: test "${{ steps.mustfail.outcome }}" = failure
      - name: a comment value that is not true or false is an error
        id: badcomment
        continue-on-error: true
        uses: ./
        with:
          plan: testdata/real_plan/create.show.json
          tier: standard
          binary: bin/applygate
          comment: sometimes
      - run: test "${{ steps.badcomment.outcome }}" = failure
      - name: a working directory that is not there is an error, with the comment asked for
        id: nodir
        continue-on-error: true
        uses: ./
        with:
          plan: tfplan
          working-directory: no/such/directory
          binary: bin/applygate
          comment: true
      - run: test "${{ steps.nodir.outcome }}" = failure
