name: False positive
description: applygate asked about or blocked something that should be allowed
labels: [false-positive]
body:
  - type: input
    id: version
    attributes: {label: applygate version, description: Output of `applygate version`}
    validations: {required: true}
  - type: input
    id: agent
    attributes: {label: Agent and version, placeholder: Claude Code 2.x / Codex 0.x / applygate check}
  - type: textarea
    id: command
    attributes:
      label: Command or tool call
      description: The exact command (or tool and file path). Remove secrets and account IDs.
      render: shell
    validations: {required: true}
  - type: textarea
    id: explain
    attributes:
      label: applygate explain output
      description: Output of `applygate explain --cwd <dir> -- '<command>'`.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Relevant .applygate.yaml
      render: yaml
  - type: textarea
    id: why
    attributes: {label: Why it should be allowed}
    validations: {required: true}
