<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview (Settings → General → Social preview). Export: docs/assets/social-preview.png, 1280×640. -->
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#ff7b72"/>

  <text x="80" y="150" class="mono" font-size="76" font-weight="700" fill="#e6edf3">applygate</text>
  <text x="80" y="222" class="sans" font-size="38" font-weight="600" fill="#e6edf3">Stop coding agents from running</text>
  <text x="80" y="272" class="sans" font-size="38" font-weight="600" fill="#e6edf3"><tspan class="mono" fill="#ff7b72">terraform destroy</tspan> in production.</text>
  <text x="80" y="330" class="sans" font-size="24" fill="#8b949e">Deterministic allow / ask / block hook for Claude Code and Codex</text>
  <text x="80" y="364" class="sans" font-size="24" fill="#8b949e">on Terraform and OpenTofu. Local. No model in the decision path.</text>

  <g transform="translate(80 412)">
    <rect width="1120" height="128" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="48" class="mono" font-size="22"><tspan fill="#39c5cf">$</tspan><tspan fill="#e6edf3"> echo dGVycmFmb3Jt… | base64 -d | sh</tspan></text>
    <text x="28" y="92" class="mono" font-size="22"><tspan fill="#ff7b72" font-weight="700">BLOCK</tspan><tspan fill="#c9d1d9">  destroy in prod (tier protected), reached via base64</tspan></text>
  </g>

  <text x="80" y="596" class="sans" font-size="22" fill="#8b949e"><tspan fill="#3fb950" font-weight="700">17 / 17</tspan> dangerous scenarios caught  ·  Apache-2.0  ·  github.com/Flurit/applygate</text>
</svg>
