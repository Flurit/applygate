<rect width="816" height="688" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="815" height="687" rx="10" fill="none" stroke="#30363d"/>
<circle cx="24" cy="17.0" r="6" fill="#ff5f57"/><circle cx="44" cy="17.0" r="6" fill="#febc2e"/><circle cx="64" cy="17.0" r="6" fill="#28c840"/>
<text class="r0" x="18" y="52" textLength="296.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e"># An agent tries to destroy production</tspan></text>
<text class="r1" x="18" y="71" textLength="631.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#39c5cf">~/acme-infra</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#e6edf3">applygate check &#x27;terraform -chdir=envs/prod destroy -auto-approve&#x27;</tspan></text>
<rect class="o1" x="135.0" y="57" width="522.6" height="19" fill="#0d1117" opacity="0"/>
<text class="r2" x="18" y="90" textLength="39.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff7b72">block</tspan></text>
<text class="r3" x="18" y="109" textLength="132.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff7b72">applygate: BLOCK.</tspan></text>
<text class="r4" x="18" y="128" textLength="280.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">- [block] destroy: terraform destroy</tspan></text>
<text class="r5" x="18" y="147" textLength="733.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">  environment: prod (tier protected; path ~/acme-infra/envs/prod/**; path envs/prod looks like</tspan></text>
<text class="r6" x="18" y="166" textLength="725.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">    production; backend s3://acme-tf-state-prod/prod/terraform.tfstate looks like production)</tspan></text>
<text class="r7" x="18" y="185" textLength="460.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">  command: terraform -chdir=envs/prod destroy -auto-approve</tspan></text>
<text class="r8" x="18" y="204" textLength="748.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">Next step:</tspan><tspan fill="#c9d1d9"> Do not retry or rephrase this. Destroying resources here needs a human: tell the user</tspan></text>
<text class="r9" x="18" y="223" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">what you intended and let them run it outside the agent.</tspan></text>
<text class="r10" x="18" y="242"><tspan fill="#e6edf3"></tspan></text>
<text class="r11" x="18" y="261" textLength="273.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e"># The same command hidden in base64</tspan></text>
<text class="r12" x="18" y="280" textLength="780.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#39c5cf">~/acme-infra</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#e6edf3">applygate check &#x27;echo dGVycmFmb3JtIC1jaGRpcj1lbnZzL3Byb2QgZGVzdHJveSAtYXV0by1hcHByb3Z</tspan></text>
<rect class="o12" x="135.0" y="266" width="670.8" height="19" fill="#0d1117" opacity="0"/>
<text class="r13" x="18" y="299" textLength="148.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e6edf3">l | base64 -d | sh&#x27;</tspan></text>
<rect class="o13" x="18.0" y="285" width="156.0" height="19" fill="#0d1117" opacity="0"/>
<text class="r14" x="18" y="318" textLength="39.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff7b72">block</tspan></text>
<text class="r15" x="18" y="337" textLength="132.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff7b72">applygate: BLOCK.</tspan></text>
<text class="r16" x="18" y="356" textLength="280.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">- [block] destroy: terraform destroy</tspan></text>
<text class="r17" x="18" y="375" textLength="733.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">  environment: prod (tier protected; path ~/acme-infra/envs/prod/**; path envs/prod looks like</tspan></text>
<text class="r18" x="18" y="394" textLength="725.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">    production; backend s3://acme-tf-state-prod/prod/terraform.tfstate looks like production)</tspan></text>
<text class="r19" x="18" y="413" textLength="460.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">  command: terraform -chdir=envs/prod destroy -auto-approve</tspan></text>
<text class="r20" x="18" y="432" textLength="226.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">  reached via: output of echo</tspan></text>
<text class="r21" x="18" y="451" textLength="647.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">    dGVycmFmb3JtIC1jaGRpcj1lbnZzL3Byb2QgZGVzdHJveSAtYXV0by1hcHByb3Zl|base64 -d | sh</tspan></text>
<text class="r22" x="18" y="470" textLength="748.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#e3b341">Next step:</tspan><tspan fill="#c9d1d9"> Do not retry or rephrase this. Destroying resources here needs a human: tell the user</tspan></text>
<text class="r23" x="18" y="489" textLength="436.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#c9d1d9">what you intended and let them run it outside the agent.</tspan></text>
<text class="r24" x="18" y="508"><tspan fill="#e6edf3"></tspan></text>
<text class="r25" x="18" y="527" textLength="218.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e"># Text that only mentions it</tspan></text>
<text class="r26" x="18" y="546" textLength="592.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#39c5cf">~/acme-infra</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#e6edf3">applygate check &#x27;git commit -m &quot;never run terraform destroy&quot;&#x27;</tspan></text>
<rect class="o26" x="135.0" y="532" width="483.6" height="19" fill="#0d1117" opacity="0"/>
<text class="r27" x="18" y="565" textLength="39.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#3fb950">allow</tspan></text>
<text class="r28" x="18" y="584"><tspan fill="#e6edf3"></tspan></text>
<text class="r29" x="18" y="603" textLength="226.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#8b949e"># Read-only work goes through</tspan></text>
<text class="r30" x="18" y="622" textLength="499.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#39c5cf">~/acme-infra</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#e6edf3">applygate check &#x27;terraform -chdir=envs/prod plan&#x27;</tspan></text>
<rect class="o30" x="135.0" y="608" width="390.0" height="19" fill="#0d1117" opacity="0"/>
<text class="r31" x="18" y="641" textLength="39.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#3fb950">allow</tspan></text>
<text class="r32" x="18" y="660" textLength="124.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#39c5cf">~/acme-infra</tspan><tspan fill="#e6edf3"> $ </tspan><tspan fill="#8b949e">█</tspan></text>
</svg>
