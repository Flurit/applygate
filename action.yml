name: applygate plan-check
description: "Judge a saved Terraform or OpenTofu plan before apply: block or ask on destroyed databases, lost protection, IAM wildcards."
author: Flurit
branding:
  icon: shield
  color: gray-dark
inputs:
  plan:
    description: Path to a saved plan (terraform plan -out) or to its JSON (terraform show -json), relative to working-directory.
    required: true
  tier:
    description: Tier to judge for (protected, standard, disposable). Default resolves from the repository's .applygate.yaml and working-directory.
    required: false
    default: ""
  fail-on:
    description: When to fail the job. block fails only on a block verdict; ask fails on ask or block; never only reports (errors always fail).
    required: false
    default: block
  working-directory:
    description: Directory the plan belongs to, for tier resolution and the backend check.
    required: false
    default: .
  terraform:
    description: Binary used for show -json when plan is a saved planfile (terraform or tofu).
    required: false
    default: terraform
  version:
    description: applygate release tag to install (ignored when binary is set).
    required: false
    default: v0.6.1
  trust-config:
    description: >-
      Read the repository's .applygate.yaml without a trust record (true or false). A CI runner has no trust store, so without
      this every directory is judged protected and the config's environments and protected_resources are not applied. The config
      read is the one in the checked-out commit, so on pull requests from forks it is the contributor's.
    required: false
    default: "false"
  comment:
    description: >-
      Write the verdict as a comment on the pull request (true or false), one comment per plan, updated on later runs. Needs
      "permissions: pull-requests: write" on the job. When the run is not for a pull request or the token cannot comment (a
      pull request from a fork), the step says so and the job goes on. The verdict and the exit code are the same either way.
    required: false
    default: "false"
  comment-key:
    description: >-
      Name shown in the comment for what was judged, in place of working-directory and plan. The comment to update is found
      by this name together with the workflow, the job and its matrix values; set it when two steps of one job judge the same
      plan in the same directory.
    required: false
    default: ""
  binary:
    description: Path to an existing applygate binary. Skips the release download; for this repository's own CI.
    required: false
    default: ""
outputs:
  verdict:
    description: allow, ask or block.
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: plan-check exit code (0 allow, 4 ask, 3 block, 2 error).
    value: ${{ steps.check.outputs.exit-code }}
  summary:
    description: The verdict line and findings, as plain text.
    value: ${{ steps.check.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Install cosign
      if: inputs.binary == ''
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install applygate (signature required)
      if: inputs.binary == ''
      shell: bash
      env:
        APPLYGATE_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # A release tag only: the value names a download path.
        if ! [[ "$APPLYGATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
          echo "version must be a release tag such as v0.6.1" >&2
          exit 2
        fi
        dir="$RUNNER_TEMP/applygate-bin"
        mkdir -p "$dir"
        # The installer comes with the action, at the ref the workflow pinned,
        # not from a branch that can move.
        APPLYGATE_VERIFY_SIGNATURE=require APPLYGATE_INSTALL_DIR="$dir" sh "$ACTION_PATH/install.sh"
        echo "APPLYGATE_BIN=$dir/applygate" >> "$GITHUB_ENV"
    - name: Use the given binary
      if: inputs.binary != ''
      shell: bash
      env:
        # Through the environment, not the script text: an input is data.
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        # A newline would add environment variables of its own.
        case "$BINARY" in *$'\n'*|*$'\r'*) echo "binary must not contain a newline" >&2; exit 2 ;; esac
        [ -x "$BINARY" ] || { echo "binary is not an executable file: $BINARY" >&2; exit 2; }
        echo "APPLYGATE_BIN=$(cd "$(dirname "$BINARY")" && pwd)/$(basename "$BINARY")" >> "$GITHUB_ENV"
    - name: plan-check
      id: check
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
        TIER: ${{ inputs.tier }}
        FAIL_ON: ${{ inputs.fail-on }}
        WORKDIR: ${{ inputs.working-directory }}
        TRUST_CONFIG: ${{ inputs.trust-config }}
        TF_BIN: ${{ inputs.terraform }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        COMMENT_FILE: ${{ runner.temp }}/applygate-pr-comment.md
        COMMENT_COMMIT: ${{ github.event.pull_request.head.sha }}
        COMMENT_SCOPE: ${{ toJSON(matrix) }}
      run: "${{ github.action_path }}/scripts/ci-plan-check.sh"
    # After the check whatever its result, so a blocked plan gets its comment
    # before the job fails, and also when the check did not run because
    # applygate could not be installed: a comment that says allow must not
    # stay then. The token is given to this step only, and the comment's text
    # reaches gh as a file, never as part of a command.
    - name: Comment on the pull request
      if: ${{ !cancelled() && inputs.comment == 'true' }}
      shell: bash
      env:
        COMMENT_FILE: ${{ runner.temp }}/applygate-pr-comment.md
        CHECK_OUTCOME: ${{ steps.check.outcome }}
        PLAN: ${{ inputs.plan }}
        WORKDIR: ${{ inputs.working-directory }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        COMMENT_SCOPE: ${{ toJSON(matrix) }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        GH_TOKEN: ${{ github.token }}
      run: "${{ github.action_path }}/scripts/ci-pr-comment.sh"
