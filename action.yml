name: applygate plan-check
description: >-
  Judge a saved Terraform or OpenTofu plan before it is applied: block or ask on destroyed or
  replaced stateful resources, removed protection, internet exposure, IAM wildcards and changes
  to the state backend, by environment tier. Deterministic, local to the runner, no network
  calls beyond downloading the signed release.
author: Flurit
branding:
  icon: shield
  color: gray-dark
inputs:
  plan:
    description: Path to a saved plan (terraform plan -out) or to its JSON (terraform show -json), relative to working-directory.
    required: true
  tier:
    description: Tier to judge for (protected, standard, disposable). Default resolves from the repository's .applygate.yaml and working-directory.
    required: false
    default: ""
  fail-on:
    description: When to fail the job. block fails only on a block verdict; ask fails on ask or block; never only reports (errors always fail).
    required: false
    default: block
  working-directory:
    description: Directory the plan belongs to, for tier resolution and the backend check.
    required: false
    default: .
  terraform:
    description: Binary used for show -json when plan is a saved planfile (terraform or tofu).
    required: false
    default: terraform
  version:
    description: applygate release tag to install (ignored when binary is set).
    required: false
    default: v0.6.0
  trust-config:
    description: >-
      Read the repository's .applygate.yaml without a trust record (true or false). A CI runner has no trust store, so without
      this every directory is judged protected and the config's environments and protected_resources are not applied. The config
      read is the one in the checked-out commit, so on pull requests from forks it is the contributor's.
    required: false
    default: "false"
  binary:
    description: Path to an existing applygate binary. Skips the release download; for this repository's own CI.
    required: false
    default: ""
outputs:
  verdict:
    description: allow, ask or block.
    value: ${{ steps.check.outputs.verdict }}
  exit-code:
    description: plan-check exit code (0 allow, 4 ask, 3 block, 2 error).
    value: ${{ steps.check.outputs.exit-code }}
  summary:
    description: The verdict line and findings, as plain text.
    value: ${{ steps.check.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Install cosign
      if: inputs.binary == ''
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install applygate (signature required)
      if: inputs.binary == ''
      shell: bash
      env:
        APPLYGATE_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # A release tag only: the value names a download path.
        if ! [[ "$APPLYGATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
          echo "version must be a release tag such as v0.6.0" >&2
          exit 2
        fi
        dir="$RUNNER_TEMP/applygate-bin"
        mkdir -p "$dir"
        # The installer comes with the action, at the ref the workflow pinned,
        # not from a branch that can move.
        APPLYGATE_VERIFY_SIGNATURE=require APPLYGATE_INSTALL_DIR="$dir" sh "$ACTION_PATH/install.sh"
        echo "APPLYGATE_BIN=$dir/applygate" >> "$GITHUB_ENV"
    - name: Use the given binary
      if: inputs.binary != ''
      shell: bash
      env:
        # Through the environment, not the script text: an input is data.
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        # A newline would add environment variables of its own.
        case "$BINARY" in *$'\n'*|*$'\r'*) echo "binary must not contain a newline" >&2; exit 2 ;; esac
        [ -x "$BINARY" ] || { echo "binary is not an executable file: $BINARY" >&2; exit 2; }
        echo "APPLYGATE_BIN=$(cd "$(dirname "$BINARY")" && pwd)/$(basename "$BINARY")" >> "$GITHUB_ENV"
    - name: plan-check
      id: check
      shell: bash
      env:
        PLAN: ${{ inputs.plan }}
        TIER: ${{ inputs.tier }}
        FAIL_ON: ${{ inputs.fail-on }}
        WORKDIR: ${{ inputs.working-directory }}
        TRUST_CONFIG: ${{ inputs.trust-config }}
        TF_BIN: ${{ inputs.terraform }}
      run: "${{ github.action_path }}/scripts/ci-plan-check.sh"
