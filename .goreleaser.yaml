# .goreleaser.yaml -- release pipeline for applygate (goreleaser v2).
#
# Run by .github/workflows/release.yml on every v* tag. It produces:
#   - reproducible static binaries for linux/darwin on amd64/arm64
#     (CGO off, -trimpath, timestamps pinned to the commit),
#   - tar.gz archives with LICENSE, NOTICE and README.md,
#   - checksums.txt (sha256) signed keylessly with cosign (Sigstore, using the
#     workflow's GitHub OIDC identity; a .sigstore.json bundle, see `signs`),
#   - a syft SBOM for every archive.
# Build provenance attestations are produced by the workflow afterwards with
# actions/attest-build-provenance, not here.
#
# Validate:  goreleaser check
# Dry run:   goreleaser release --snapshot --clean
version: 2

project_name: applygate

before:
  hooks:
    # Dependencies are pinned in go.mod/go.sum; verify them rather than tidy.
    - go mod verify

builds:
  - id: applygate
    main: ./cmd/applygate
    binary: applygate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # To give a release a default telemetry endpoint (docs/telemetry.md), add:
      #   -X github.com/Flurit/applygate/internal/telemetry.DefaultEndpoint=https://...
      # No release carries one yet; telemetry stays off until a person turns it on.
      - -s -w -X github.com/Flurit/applygate/internal/hook.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Reproducible builds: stamp the binary with the commit time, not the
    # build machine's clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
  # Compatibility entry point for installs that still call "seatbelt"
  # (hook entries with an absolute path to the old binary). Ships for one
  # release after the rename; it prints a deprecation line and runs applygate.
  - id: seatbelt-shim
    main: ./cmd/seatbelt
    binary: seatbelt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    ids:
      - applygate
      - seatbelt-shim
    formats:
      - tar.gz
    name_template: "applygate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  # Keyless signing of checksums.txt with cosign 3.x, which writes one
  # Sigstore bundle (signature + certificate + transparency-log entry) and
  # ignores the old --output-signature/--output-certificate flags. The bundle
  # is uploaded next to the checksums as checksums.txt.sigstore.json. Verify:
  #   cosign verify-blob --bundle checksums.txt.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/Flurit/applygate/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     checksums.txt
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - id: archives
    artifacts: archive

release:
  github:
    owner: Flurit
    name: applygate
  draft: false
  # Tags with a pre-release suffix (v1.2.3-rc1) are marked as pre-releases.
  prerelease: auto
  # Keep notes and assets a human added to an existing release.
  mode: keep-existing

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - "^style:"
      - "^refactor:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge remote-tracking branch"
      - "Merge branch"

# Homebrew tap. Enable once the Flurit/homebrew-tap repository exists and the
# release workflow has a token that can push to it (GITHUB_TOKEN cannot push
# to another repository; use a fine-grained PAT or a GitHub App token exposed
# as HOMEBREW_TAP_TOKEN).
#
# brews:
#   - name: applygate
#     ids:
#       - tarballs
#     repository:
#       owner: Flurit
#       name: homebrew-tap
#       branch: main
