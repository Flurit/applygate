# False-positive study: a Terraform runner plus a LocalStack sidecar that
# stands in for AWS. See README.md in this directory.
#
# A separate compose project from review/agent-trial, so the trial's
# containers and volumes are never touched. The runner gets exactly one set of
# AWS settings: LocalStack's dummy credentials and an endpoint override. The
# AWS config and credential files point at /dev/null and nothing from the
# host's ~/.aws is mounted. The study work directory (clones, plans, logs) is
# a bind mount so the host can run applygate plan-check on the plan JSON.
name: applygate-fp-study

services:
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      # Every community service; the runner records which applies fail.
      EAGER_SERVICE_LOADING: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 24
    # Not published on the host: only the runner can reach it.
    networks:
      default:
        aliases:
          # S3 Control requests go to <account-id>.<endpoint host>; provider
          # 6.x reads bucket tags through S3 Control.
          - 000000000000.localstack

  runner:
    build:
      context: ../..
      dockerfile: review/fp-study/Dockerfile
    image: applygate-fp-study:local
    init: true
    # Rootless Docker maps container root to the invoking host user, which is
    # what makes the bind-mounted work directory writable. Under rootful
    # Docker, set FP_STUDY_USER to your uid:gid instead.
    user: ${FP_STUDY_USER:-0:0}
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"
      # The roots carry no lock files, and without this Terraform reinstalls
      # every provider into the shared cache, over a binary another worker
      # may be running ("text file busy").
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    volumes:
      - tf-plugin-cache:/home/study/.terraform.d/plugin-cache
      - ${FP_STUDY_WORK:-./work}:/study
      # The corpus list and the scripts, read-only.
      - ./corpus.txt:/home/study/fp/corpus.txt:ro
      - ./tools:/home/study/fp/tools:ro

volumes:
  tf-plugin-cache:
